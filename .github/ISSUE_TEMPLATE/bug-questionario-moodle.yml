name: 🐛 Erro em Questionário (Moodle)
description: Reportar falhas de configuração, cálculo de notas, exibição ou execução em atividades de Questionário.
title: "[Questionário]: "
labels: ["bug", "moodle-quiz", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar este problema! Por favor, preencha os campos abaixo com o máximo de detalhes possível para agilizar a análise técnica e pedagógica.

  - type: input
    id: contexto_curso
    attributes:
      label: Link ou ID do Curso e do Questionário
      description: Cole a URL direta do questionário (ex: https://ava.instituicao.edu.br/mod/quiz/view.php?id=12345) ou informe o nome exato da disciplina.
      placeholder: "https://..."
    validations:
      required: true

  - type: dropdown
    id: categoria_problema
    attributes:
      label: Categoria do Problema
      description: Qual área do questionário está apresentando falha?
      options:
        - Cálculo de notas / Avaliação / Reavaliação
        - Exibição de questões / Formatação / Imagens quebradas
        - Comportamento da questão (ex: Feedback adiado, Adaptativo, CBM)
        - Restrições de acesso, tempo limite ou tentativas
        - Banco de questões / Importação ou exportação (XML, GIFT, Aiken)
        - Travamento / Erro 500 / Timeout ao enviar tentativa
        - Outro
    validations:
      required: true

  - type: dropdown
    id: tipo_questao
    attributes:
      label: Tipo de Questão Afetada (se aplicável)
      options:
        - Não se aplica (problema geral no questionário)
        - Múltipla escolha
        - Verdadeiro/Falso
        - Associação (Matching)
        - Resposta curta
        - Numérica / Calculada
        - Dissertativa (Essay)
        - Arrastar e soltar (sobre texto ou imagem)
        - Cloze (Respostas embutidas)
        - Plugin de terceiros (ex: CodeRunner, STACK, H5P)
    validations:
      required: false

  - type: textarea
    id: descricao
    attributes:
      label: Descrição do Problema
      description: Explique claramente o que está acontecendo. Se afetar apenas alunos específicos, informe os IDs ou matrículas.
      placeholder: "Ao finalizar a tentativa, a nota exibida no livro de notas não corresponde à soma das questões..."
    validations:
      required: true

  - type: textarea
    id: passos_reproduzir
    attributes:
      label: Passos para Reproduzir
      description: Como a equipe técnica pode simular o erro?
      value: |
        1. Acessar o questionário '...'
        2. Iniciar/Visualizar tentativa como papel '...'
        3. Responder a questão '...' com o valor '...'
        4. Clicar em 'Enviar tudo e terminar' e observar o erro
    validations:
      required: true

  - type: textarea
    id: comportamento_esperado
    attributes:
      label: Comportamento Esperado
      description: O que deveria acontecer normalmente segundo a configuração da atividade?
    validations:
      required: true

  - type: textarea
    id: evidencias_logs
    attributes:
      label: Prints, Vídeos ou Mensagens de Erro (Debug)
      description: Arraste e solte capturas de tela aqui. Se o modo de depuração (Debug) do Moodle estiver ativo, cole o stack trace abaixo.
      render: shell

  - type: input
    id: ambiente_moodle
    attributes:
      label: Ambiente (Versão do Moodle / Navegador / Dispositivo)
      description: Informe se o erro ocorre no navegador desktop ou no Moodle App.
      placeholder: "Ex: Moodle 4.5 | Google Chrome 130 | Windows 11"
    validations:
      required: true

  - type: checkboxes
    id: checklist_triagem
    attributes:
      label: Verificações Preliminares
      options:
        - label: Verifiquei se o problema ocorre também na visualização prévia (Preview) do professor.
        - label: Confirmei que não há bloqueio por restrição de data, grupo ou nota mínima.
        - label: O problema já impactou tentativas reais de estudantes em andamento.
        
