name: 🐛 Erro em Questionário (Moodle)
description: Reportar falhas de configuração, cálculo de notas, exibição ou execução em atividades de Questionário.
title: "[Questionário]: "
labels: ["bug", "moodle-quiz", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar este problema! Por favor, preencha os campos abaixo com o máximo de detalhes possível para agilizar a análise técnica e pedagógica.

  - type: input
    id: nome_completo
    attributes:
      label: Nome Completo
      description: Informe o nome completo do usuário ou estudante afetado.
      placeholder: "Ex: Maria da Silva Santos"
    validations:
      required: true

  - type: input
    id: questionario
    attributes:
      label: Questionário
      description: Informe o nome exato ou número do questionário onde ocorreu o problema.
      placeholder: "Ex: Questionário Avaliativo 01 - Unidade 2"
    validations:
      required: true

  - type: input
    id: tentativa
    attributes:
      label: Tentativa
      description: Informe o número da tentativa em que o erro aconteceu.
      placeholder: "Ex: Tentativa 1"
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: Descrição do Problema
      description: Explique claramente o que está acontecendo.
      placeholder: "Ao finalizar a tentativa, a nota exibida no livro de notas não corresponde à soma das questões..."
    validations:
      required: true

  - type: textarea
    id: comportamento_esperado
    attributes:
      label: Comportamento Esperado
      description: O que deveria acontecer normalmente segundo a configuração da atividade?
    validations:
      required: true

  - type: textarea
    id: print_questao
    attributes:
      label: Print da Questão
      description: Arraste e solte, cole (Ctrl+V) ou selecione a imagem mostrando a questão e o problema ocorrido.
      placeholder: "Cole a captura de tela aqui..."
    validations:
      required: true

  - type: textarea
    id: logs_debug
    attributes:
      label: Mensagens de Erro / Debug (Opcional)
      description: Se o modo de depuração (Debug) do Moodle estiver ativo ou houver erro no console do navegador, cole o texto abaixo.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist_triagem
    attributes:
      label: Verificações Preliminares
      options:
        - label: Verifiquei se o problema ocorre também na visualização prévia (Preview) do professor.
        - label: Confirmei que não há bloqueio por restrição de data, grupo ou nota mínima.
        - label: O problema já impactou tentativas reais de estudantes em andamento.
        
