name: 🐛 Erro em Questionário (Moodle)
description: Reportar falhas de configuração, cálculo de notas, exibição ou execução em atividades de Questionário.
title: "[Questionário]: "
labels: ["bug", "moodle-quiz", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar este problema! Preencha os campos abaixo com o máximo de detalhes possível para agilizar a análise técnica e pedagógica.

  - type: input
    id: contexto_curso
    attributes:
      label: Link ou ID do Curso e do Questionário (Opcional)
      description: "Cole a URL direta do questionário (ex: https://ava.instituicao.edu.br/mod/quiz/view.php?id=12345) apenas se diferir do ambiente padrão."
      placeholder: "https://..."
    validations:
      required: false

  - type: dropdown
    id: categoria_problema
    attributes:
      label: Categoria do Problema (Opcional)
      description: Qual área do questionário está apresentando falha?
      options:
        - Cálculo de notas / Avaliação / Reavaliação
        - Exibição de questões / Formatação / Imagens quebradas
        - "Comportamento da questão (ex: Feedback adiado, Adaptativo, CBM)"
        - Restrições de acesso, tempo limite ou tentativas
        - Banco de questões / Importação ou exportação (XML, GIFT, Aiken)
        - Travamento / Erro 500 / Timeout ao enviar tentativa
        - Outro
    validations:
      required: false

  - type: dropdown
    id: tipo_questao
    attributes:
      label: Tipo de Questão Afetada (se aplicável)
      options:
        - Não se aplica (problema geral no questionário)
        - Múltipla escolha
        - Verdadeiro/Falso
        - Associação (Matching)
        - Resposta curta
        - Numérica / Calculada
        - Dissertativa (Essay)
        - Arrastar e soltar (sobre texto ou imagem)
        - Cloze (Respostas embutidas)
        - "Plugin de terceiros (ex: CodeRunner, STACK, H5P)"
    validations:
      required: false

  - type: textarea
    id: descricao
    attributes:
      label: Descrição do Problema
      description: Explique claramente o que está acontecendo. Se afetar apenas alunos específicos, informe os IDs ou matrículas.
      placeholder: "Ao finalizar a tentativa, a nota exibida no livro de notas não corresponde à soma das questões..."
    validations:
      required: true

  - type: textarea
    id: passos_reproduzir
    attributes:
      label: Passos para Reproduzir
      description: Como a equipe técnica pode simular o erro?
      value: |
        1. Acessar o
